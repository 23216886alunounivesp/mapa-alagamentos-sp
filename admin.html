<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Moderação e Curadoria Unificado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --navy: #0f172a;
            --bg: #f8fafc;
            --surface: #ffffff;
            --line: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --green: #16a34a;
            --orange: #ea580c;
            --red: #dc2626;
            --blue: #0284c7;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); }
        .admin-header { background: var(--navy); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .admin-header h1 { font-size: 1.25em; margin: 0; font-weight: 700; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn, .status-btn { padding: 8px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-weight: 600; font-size: 0.85em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .tab-btn.active, .status-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .status-badge { font-size: 0.75em; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display: inline-block; padding: 2px 6px; border-radius: 4px; }
        .badge-pendente { color: var(--orange); background: #fff7ed; }
        .badge-aprovado { color: var(--green); background: #f0fdf4; }
        .badge-rejeitado { color: var(--red); background: #fef2f2; }
        .card-title { font-weight: 700; margin: 0 0 6px; font-size: 1.05em; }
        .card-meta { font-size: 0.8em; color: var(--muted); margin-bottom: 12px; }
        .actions-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.82em; cursor: pointer; color: white; text-align: center; }
        .btn-aprovar { background: var(--green); }
        .btn-rejeitar { background: var(--orange); }
        .btn-aprovado-disabled { background: #94a3b8; cursor: pointer; }
        .empty-msg { text-align: center; padding: 40px; color: var(--muted); font-weight: 500; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>🛡️ Painel de Moderação e Curadoria Unificado</h1>
    </header>

    <div class="container">
        <!-- TIPO DE CONTEÚDO (SEM RSS) -->
        <div class="filter-bar">
            <button class="tab-btn active" id="tab-foto" onclick="mudarTipo('foto')">📸 Relatos com Foto</button>
            <button class="tab-btn" id="tab-forum" onclick="mudarTipo('forum')">💬 Fórum: Choveu? Alagou?</button>
        </div>

        <!-- FILTRO DE STATUS -->
        <div class="filter-bar">
            <button class="status-btn active" id="st-pendentes" onclick="mudarStatus('pendente')">⏳ Pendentes</button>
            <button class="status-btn" id="st-aprovados" onclick="mudarStatus('aprovado')">🟢 Aprovados</button>
            <button class="status-btn" id="st-rejeitados" onclick="mudarStatus('rejeitado')">🔴 Rejeitados</button>
            <button class="status-btn" id="st-todos" onclick="mudarStatus('todos')">📋 Todos</button>
        </div>

        <div id="cards-container" class="cards-grid"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ebknsiiirqpfsrjewpou.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KU-HNUH_WR3uagFDzubHvQ_AvACKYVO';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tipoAtual = 'foto';
        let statusAtual = 'pendente';
        let listaRegistros = [];

        function mudarTipo(tipo) {
            tipoAtual = tipo;
            document.getElementById('tab-foto').classList.toggle('active', tipo === 'foto');
            document.getElementById('tab-forum').classList.toggle('active', tipo === 'forum');
            carregarRegistros();
        }

        function mudarStatus(st) {
            statusAtual = st;
            document.getElementById('st-pendentes').classList.toggle('active', st === 'pendente');
            document.getElementById('st-aprovados').classList.toggle('active', st === 'aprovado');
            document.getElementById('st-rejeitados').classList.toggle('active', st === 'rejeitado');
            document.getElementById('st-todos').classList.toggle('active', st === 'todos');
            renderizarCards();
        }

        async function carregarRegistros() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '<div class="empty-msg">Carregando dados do Supabase... ⏳</div>';

            const tabela = tipoAtual === 'foto' ? 'confirmacoes_alagamento' : 'forum_choveu_alagou';

            try {
                const { data, error } = await supabaseClient
                    .from(tabela)
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                listaRegistros = data || [];
                renderizarCards();
            } catch (err) {
                container.innerHTML = `<div class="empty-msg" style="color:var(--red);">Erro ao carregar dados: ${err.message}</div>`;
            }
        }

        function renderizarCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const filtrados = listaRegistros.filter(item => {
                const status = item.status_moderacao || 'pendente';
                if (statusAtual === 'todos') return true;
                return status === statusAtual;
            });

            if (filtrados.length === 0) {
                container.innerHTML = '<div class="empty-msg">Nenhum registo encontrado para os filtros selecionados.</div>';
                return;
            }

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const status = item.status_moderacao || 'pendente';
                const dataHora = item.created_at ? new Date(item.created_at).toLocaleString('pt-BR') : 'Data n/i';

                let imagemHtml = '';
                if (tipoAtual === 'foto') {
                    if (item.foto_url) {
                        imagemHtml = `<img src="${item.foto_url}" class="card-img" alt="Foto do relato" onerror="this.onerror=null; this.outerHTML='<div class=\\'card-img\\'>⚠️ Imagem indisponível</div>';">`;
                    } else {
                        imagemHtml = `<div class="card-img">Sem Foto Anexada</div>`;
                    }
                }

                const ehAprovado = status === 'aprovado';
                const textoBotaoAprovar = ehAprovado ? '✅ Já Aprovado por Si' : '✓ Aprovar';
                const classeBotaoAprovar = ehAprovado ? 'btn-action btn-aprovado-disabled' : 'btn-action btn-aprovar';

                let titulo = tipoAtual === 'foto' ? (item.status === 'alagado' ? '🚨 Ponto Alagado' : '🟢 Pista Liberada') : `💬 Bairro: ${item.bairro || 'São Paulo'}`;
                let detalhes = tipoAtual === 'foto' 
                    ? (item.observacao ? `<p style="margin: 4px 0; font-size: 0.85em; color:#334155;">${item.observacao}</p>` : '')
                    : `<div style="font-size:0.85em; margin-top:4px;">🌧️ Choveu: <b>${item.choveu ? 'Sim' : 'Não'}</b> | 🌊 Alagou: <b>${item.alagou ? 'Sim' : 'Não'}</b></div>`;

                card.innerHTML = `
                    ${imagemHtml}
                    <div class="card-body">
                        <div>
                            <span class="status-badge badge-${status}">${status.toUpperCase()}</span>
                            <div class="card-title">${titulo}</div>
                            <div class="card-meta">
                                🕒 Data/Hora: ${dataHora}<br>
                                📍 GPS: ${item.latitude || 'n/a'}, ${item.longitude || 'n/a'}
                            </div>
                            ${detalhes}
                        </div>
                        <div class="actions-row">
                            <button class="${classeBotaoAprovar}" onclick="aprovarRegistro('${item.id}', ${ehAprovado})">${textoBotaoAprovar}</button>
                            <button class="btn-action btn-rejeitar" onclick="rejeitarRegistro('${item.id}')">✕ Rejeitar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function aprovarRegistro(id, jaAprovado) {
            if (jaAprovado) {
                alert('ℹ️ Este relato já foi aprovado por você!');
                return;
            }

            const tabela = tipoAtual === 'foto' ? 'confirmacoes_alagamento' : 'forum_choveu_alagou';

            try {
                const { error } = await supabaseClient
                    .from(tabela)
                    .update({ status_moderacao: 'aprovado', aprovado: true })
                    .eq('id', id);

                if (error) throw error;

                alert('✅ Registro aprovado com sucesso!');
                carregarRegistros();
            } catch (err) {
                alert('❌ Erro ao aprovar registro: ' + err.message);
            }
        }

        async function rejeitarRegistro(id) {
            const tabela = tipoAtual === 'foto' ? 'confirmacoes_alagamento' : 'forum_choveu_alagou';

            try {
                const { error } = await supabaseClient
                    .from(tabela)
                    .update({ status_moderacao: 'rejeitado', aprovado: false })
                    .eq('id', id);

                if (error) throw error;

                alert('🔴 Registro rejeitado!');
                carregarRegistros();
            } catch (err) {
                alert('❌ Erro ao rejeitar registro: ' + err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', carregarRegistros);
    </script>
</body>
</html>
